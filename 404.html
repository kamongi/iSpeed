<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>iSpeed - BPM Detection</title>
    <script>
      // GitHub Pages SPA redirect hack
      // When a 404 occurs, redirect to index.html with the original path in query string
      window.location.replace('/iSpeed/?' + window.location.pathname.slice(1).replace(/&/g, '~and~') + (window.location.search ? '&' + window.location.search.slice(1).replace(/&/g, '~and~') : '') + window.location.hash);
    </script>
  </head>
  <body>
    <h1>Redirecting to iSpeed...</h1>
    <p>If you are not redirected in a few seconds, <a href="/iSpeed/">click here</a>.</p>
  </body>
</html>
