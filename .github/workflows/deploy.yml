name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/add-claude-documentation-ATQTA', 'main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: client
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: client
        run: npm run build

      - name: Create .nojekyll file
        run: touch client/dist/.nojekyll

      - name: Verify dist directory
        run: |
          echo "Checking dist directory..."
          ls -la client/dist/
          echo "---"
          echo "Checking for 404.html:"
          test -f client/dist/404.html && echo "✓ 404.html found" || echo "✗ 404.html missing"
          echo "Checking for .nojekyll:"
          test -f client/dist/.nojekyll && echo "✓ .nojekyll found" || echo "✗ .nojekyll missing"
          echo "---"
          du -sh client/dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
          cname: ''
